name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  start-foundation:
    name: TanStack Start foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Start dependencies
        run: pnpm --dir apps/start install --frozen-lockfile

      - name: Audit Start production dependencies
        run: pnpm --dir apps/start audit --prod --audit-level moderate

      - name: Build Start preview
        run: pnpm --dir apps/start build

      - name: Check Start types
        run: pnpm --dir apps/start typecheck

      - name: Check Start response security
        shell: bash
        run: |
          PORT=3101 HOST=127.0.0.1 node apps/start/.output/server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3101/ >/dev/null; then break; fi
            sleep 1
          done
          pnpm --dir apps/start smoke:security

  quality:
    name: Lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-ci-service-role-key
      # Exercise the hosted authentication build path here. The local browser
      # journey job below deliberately switches to email/password fixtures.
      NEXT_PUBLIC_AUTH_MODE: google

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  critical-journeys:
    name: Local browser and RLS journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start local Supabase
        run: supabase start

      - name: Configure local application environment
        shell: bash
        run: |
          supabase status -o env > supabase-env.txt
          source supabase-env.txt
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_AUTH_MODE=email"
          } > .env.local

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run clean local journeys
        run: pnpm test:e2e:local
